name: Rust 工作区 CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_RUST_TOOLCHAIN: nightly-2026-11-23
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-check-test:
    name: linux-check-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装 lld 链接器
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: 安装并锁定 Rust nightly 工具链
        run: |
          rustup toolchain install "$CI_RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$CI_RUST_TOOLCHAIN"
          rustc -vV
      - name: 复用 Cargo 与 target 缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: unbound-ui-linux
          cache-on-failure: true
      - name: 全量 Clippy 门禁
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: 全量单元测试与集成测试
        run: cargo test --workspace --all-features

  windows-check:
    name: windows-check
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装并锁定 Rust nightly 工具链
        shell: pwsh
        run: |
          rustup toolchain install "$env:CI_RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$env:CI_RUST_TOOLCHAIN"
          rustc -vV
      - name: 复用 Cargo 与 target 缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: unbound-ui-windows
          cache-on-failure: true
      - name: Windows 平台全量编译检查
        run: cargo check --workspace --all-targets --all-features

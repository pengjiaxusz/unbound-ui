name: 提交门禁

on:
  pull_request:
  merge_group:
  push:
    branches: [main, master]
  workflow_dispatch:

# 同一个分支只保留最新一次运行：过期的运行报告的提交范围早已不存在。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 本地提交钩子的服务端对应物。它不需要贡献者机器上的任何配置，所以即使作者从未安装 CLI，PR 一样会被校验。
permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    # 这里的名字是刻意保持稳定的标识：必需状态检查引用的就是它，而这份引用不能因为文档语言切换就失效。
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 使用最新主版本 Action（Node 24 运行时，无 Node 20 弃用警告）；项目扩展自有 CI 工作流时，建议统一采用 `actions/checkout@v7`、`actions/cache@v6`、`Swatinem/rust-cache@v2`、`taiki-e/install-action@v2` 并开启 `concurrency`。
      - uses: actions/checkout@v7
        with:
          # 校验提交范围需要完整历史；检出 head ref 可避免把 GitHub 自动生成的合并提交算进来。
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # checkout 默认不检出子模块，路径依赖放在子模块里的项目连 workspace 都加载不了，而报错表现为「找不到依赖」而不是缺子模块。没有子模块的项目不受影响。
          submodules: true

      # 保持 `gate` 在每次推送与 PR 上运行以确保必需状态检查永不挂起，但若本次改动仅涉及文档，则跳过 Rust 与代码检查步骤。
      - name: 探测代码变更
        id: changes
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${GATE_BASE:-}"
          if printf '%s' "$base" | grep -qE '^0+$' || [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base"..HEAD 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|.agents/*|.github/pull_request_template.md|LICENSE*)
                ;;
              */*)
                code_changed=true
                break
                ;;
              *.md)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done <<EOF
          $changed
          EOF
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: 安装 pengj-templates-cli
        run: |
          curl -fsSL https://github.com/pengjiaxusz/pengj-templates/releases/latest/download/install.sh | sh
          echo "${XDG_DATA_HOME:-$HOME/.local/share}/pengj-templates/bin" >> "$GITHUB_PATH"

      - name: 校验提交标题
        env:
          # 范围的基准：PR 用目标分支，推送用上一个提交。
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${GATE_BASE:-}"
          # 全零 base 代表分支删除，而 force-push 之后 base 也可能指向一个已不存在的提交；两种情况都退回不带 base 的检查，否则 git log 会直接报错，门禁因无关原因失败。
          if printf '%s' "$base" | grep -qE '^0+$' || { [ -n "$base" ] && ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; }; then
            base=""
          fi
          set +e
          if [ -n "$base" ]; then
            output=$(pengj-templates-cli gate check-commits --base "$base" 2>&1)
          else
            output=$(pengj-templates-cli gate check-commits 2>&1)
          fi
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## 提交门禁拦下了这段提交"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
              echo ""
              echo '范围内每个提交的标题都要写成 `type(scope): 摘要`。规则集在 `.pengj-templates/gate.toml` 里。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: 运行代码语言守卫
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          set +e
          output=$(pengj-templates-cli gate check 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## 代码语言守卫报了违规"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: 校验文案语言
        run: |
          set +e
          output=$(pengj-templates-cli check-lang --dir . 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## 文案语言门禁报了违规"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
              echo ""
              echo '英文项目不得出现汉字，中文项目面向人的文案必须含中文。请到模板源修复后对项目执行 `update`。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # 本地 pre-commit 钩子会格式化暂存的 Rust 文件；没装 CLI 时这一步不会发生，所以由服务端补上。
      - name: 检查代码格式
        if: steps.changes.outputs.code_changed == 'true'
        run: cargo fmt --check
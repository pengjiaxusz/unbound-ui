# lefthook.yml — git hooks 配置（lefthook 层）
pre-commit:
  commands:
    rustfmt:
      glob: "*.rs"
      run: rustfmt {staged_files}
      stage_fixed: true
    # 中文字符守卫：本项目 chinese_programming 为 false，标识符必须英文；
    # 字符串里的中文仅限 i18n 翻译表等经 `zh-ok` / `zh-strings-allow` 认证的场景。
    zh-strings:
      glob: "*.rs"
      run: node scripts/check-zh-strings.mjs {staged_files}

commit-msg:
  commands:
    commitlint:
      # 用 pnpm exec（本地已装 commitlint）而非 npx；"{1}" 是 lefthook 占位符（跨平台，勿用 $1）
      run: pnpm exec commitlint --edit "{1}"

# lefthook.yml — git hooks 配置（lefthook 层）
pre-commit:
  commands:
    rustfmt:
      glob: "*.rs"
      run: rustfmt {staged_files}
      stage_fixed: true
    # 代码语言守卫：本项目 chinese_programming 为 false，标识符与字符串文案必须英文；
    # 每文件容忍不超过 1% 的字符串例外，真实例外用 `lang-ok:` / `lang-allow:` 认证。
    lang-guard:
      glob: "*.rs"
      run: node scripts/check-lang.mjs {staged_files}

commit-msg:
  commands:
    commitlint:
      # 用 pnpm exec（本地已装 commitlint）而非 npx；"{1}" 是 lefthook 占位符（跨平台，勿用 $1）
      run: pnpm exec commitlint --edit "{1}"

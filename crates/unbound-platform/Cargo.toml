[package]
name = "unbound-platform"
description = "Window platform layer: non-blocking resize, DWM tear-free presentation and input-to-photon accounting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
unbound-math.workspace = true
unbound-gpu.workspace = true
unbound-a11y.workspace = true
accesskit.workspace = true
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-core.workspace = true
# UI Automation 提供者：把同一棵语义树暴露给屏幕阅读器与第三方工具。
# 与 accesskit 0.25 配对的版本是 0.35.x。
accesskit_windows = "0.35.2"


[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
libc = "0.2"
x11rb = { version = "0.14", default-features = false, features = ["allow-unsafe-code", "dl-libxcb", "randr", "xfixes", "cursor"] }

[lints]
workspace = true

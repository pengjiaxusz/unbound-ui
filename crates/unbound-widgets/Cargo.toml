[package]
name = "unbound-widgets"
description = "Standard controls: the shared descriptor, visual state and emission vocabulary every widget speaks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
unbound-math.workspace = true
unbound-abi.workspace = true
unbound-gpu.workspace = true
unbound-text.workspace = true
unbound-theme.workspace = true
unbound-world.workspace = true
unbound-input.workspace = true
unbound-a11y.workspace = true
unbound-anim.workspace = true
unbound-asset.workspace = true
unbound-headless.workspace = true
unbound-canvas.workspace = true
unbound-vector.workspace = true
accesskit.workspace = true
rustc-hash.workspace = true
slotmap.workspace = true
smallvec.workspace = true

# 非 Windows 平台在单包执行 `unbound-widgets` 测试时，默认特性 `backend-native`
# 不会编译 DirectWrite，需在开发依赖中显式启用 `backend-swash` 保证字形光栅化可用。
[target.'cfg(not(windows))'.dev-dependencies]
unbound-text = { workspace = true, features = ["backend-swash"] }

[lints]
workspace = true

[package]
name = "unbound-math"
description = "Allocation-free scalar, vector, rectangle, affine and linear-colour math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck.workspace = true
half.workspace = true
# 这些值类型要穿过 Agent 的序列化边界（HTTP / 命名管道），
# 因此必须能被 serde 编码；派生是零成本的。
serde = { workspace = true }

[lints.rust]
# `[lints] workspace = true` cannot coexist with a table override, so this crate
# restates the workspace's one rust lint and adds its own ban on `unsafe`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

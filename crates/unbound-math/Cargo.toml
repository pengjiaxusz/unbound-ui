[package]
name = "unbound-math"
description = "Allocation-free scalar, vector, rectangle, affine and linear-colour math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck.workspace = true
half.workspace = true

[lints.rust]
# `[lints] workspace = true` cannot coexist with a table override, so this crate
# restates the workspace's one rust lint and adds its own ban on `unsafe`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
